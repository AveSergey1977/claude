name: Quotes

# GitHub runs schedules on a best-effort basis and drops or delays many of them
# (in October roughly one 15-minute slot in four actually ran). So the workflow
# fires every 5 minutes and `scripts/fetch_quotes.py gate` refreshes only when the
# published data is due: older than 15 min while LSE or NYSE is open, older than
# 6 h otherwise. A dropped run is made up by the next one that does fire.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    # Deploys to github-pages are allowed only from the default branch.
    branches: [main, claude/stock-portfolio-tracker-c5bit1]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/quotes.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# A newer run supersedes an older one. Without cancel-in-progress, a deploy job
# stuck in "waiting" on the github-pages environment blocked the queue and every
# later run was cancelled while pending.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: >
          python scripts/fetch_quotes.py gate
          --data-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/quotes.json?t=${{ github.run_id }}"

      - id: pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - if: steps.gate.outputs.run == 'true'
        run: pip install --quiet "curl_cffi>=0.7"

      - if: steps.gate.outputs.run == 'true'
        run: >
          python scripts/fetch_quotes.py fetch
          --out site/data/quotes.json
          --prev-url "${{ steps.pages.outputs.base_url }}/data/quotes.json"

      - if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
